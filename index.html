<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galactic Archive RPG</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="main-menu-btn" onclick="goToMainMenu()" class="hud-home-btn">
    🏠 Main Menu
  </button>
  <div class="game-container">
    <!-- Comic Panel Screen -->
    <div id="panel-box" class="panel-box">
      
      <!-- NASA Real Data Overlay (HUD) -->
      <div id="hud-overlay" class="hud-overlay hidden">
        <span class="hud-header">REAL NASA TELEMETRY</span>
        <img id="hud-img" src="" alt="Telemetry Data">
        <p id="hud-caption"></p>
      </div>

      <!-- Comic Caption Box -->
      <div id="caption-box" class="caption-box"></div>
    </div>

    <!-- Choice Buttons Area -->
    <div id="choices-container" class="choices-container"></div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
