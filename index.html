<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galactic Archive RPG</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top HUD Bar (Hidden initially on title screen) -->
  <div id="hud-bar" class="hidden">
    <button id="main-menu-btn" onclick="goToMainMenu()" class="hud-home-btn">
      🏠 Main Menu
    </button>
    
    <!-- Mute Toggle Button -->
    <button id="mute-btn" onclick="audioManager.toggleMute()" class="hud-mute-btn">
      🔊 SOUND
    </button>
    
    <!-- Achievement Badges Floating Bar -->
    <div id="achievement-panel" class="badge-container">
      <!-- Badges render dynamically -->
    </div>
  </div>

  <div class="game-container">

    <!-- Title / First Screen Page -->
    <div id="title-screen" class="title-screen">
      <div class="title-content">
        <img src="assets/panels/game_icon.jpg" alt="Galactic Archive Icon" class="game-cover-icon">
        <h1 class="game-title">GALACTIC ARCHIVE</h1>
        <p class="game-subtitle">Interactive Space History RPG</p>

        <!-- Interactive Astro Care Audio Unlock Trigger -->
        <div id="secret-astro-zone" class="secret-astro-zone">
          <span class="glowing-astro-text">__presented by Astro Care__</span>
        </div>
        
        <div class="title-menu-buttons">
          <button id="start-new-btn" class="start-btn" onclick="startNewGame()">START YOUR JOURNEY!</button>
          <button id="reset-btn" class="start-btn restore-btn" onclick="resetSession()">RESET SESSION...</button>
        </div>
      </div>
    </div>

    <!-- Comic Panel Screen (Hidden until Start Game) -->
    <div id="panel-box" class="panel-box hidden">
      <!-- NASA Real Data Overlay (HUD) -->
      <div id="hud-overlay" class="hud-overlay hidden">
        <span class="hud-header">REAL NASA TELEMETRY</span>
        <img id="hud-img" src="" alt="Telemetry Data">
        <p id="hud-caption"></p>
      </div>

      <!-- Comic Caption Box -->
      <div id="caption-box" class="caption-box"></div>
      
      <!-- Hidden Interactive Easter Egg Overlay (Rez) -->
      <div id="secret-rez-zone" class="secret-rez-zone hidden">
        <span class="glowing-rez-text">Rez...</span>
      </div>

      <!-- Hidden Interactive Easter Egg Overlay (Astro Care) -->
      <div id="secret-astro-zone" class="secret-astro-zone hidden">
        <span class="glowing-astro-text">Astro Care</span>
      </div>
    </div>

    <!-- Choice Buttons Area (Hidden until Start Game) -->
    <div id="choices-container" class="choices-container hidden"></div>
  </div>

  <!-- Audio Manager Class First, then Game Logic -->
  <script src="audio.js"></script>
  <script src="script.js"></script>
</body>
</html>
